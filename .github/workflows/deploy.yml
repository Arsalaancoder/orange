name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # VITE_CLERK_PUBLISHABLE_KEY is NOT passed here intentionally.
          # The value in the committed .env file is used by Vite automatically.
          # Passing it via GitHub secret would override .env with an empty string
          # if the secret is not configured, breaking Clerk auth initialization.
          #
          # API endpoints — these have hardcoded fallbacks so build never fails.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://orange-paramedical-api.orange-paramedical.workers.dev/api' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://orange-paramedical-api.orange-paramedical.workers.dev/api' }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: '.'
