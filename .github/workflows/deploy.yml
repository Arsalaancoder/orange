name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    # The Clerk key is currently configured as an Actions environment secret
    # in the environment named VITE_CLERK_PUBLISHABLE_KEY.
    environment: VITE_CLERK_PUBLISHABLE_KEY
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Configure this repository secret with the production Clerk publishable key.
          # Do not fall back to a committed development/test key for production.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          #
          # API endpoints — these have hardcoded fallbacks so build never fails.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://orange-paramedical-api.orange-paramedical.workers.dev/api' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://orange-paramedical-api.orange-paramedical.workers.dev/api' }}

      - name: Check Cloudflare deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN Actions secret. Add it to the VITE_CLERK_PUBLISHABLE_KEY environment or repository Actions secrets."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: '.'
