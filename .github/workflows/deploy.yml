name: Build and deploy Orange Paramedical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: https://orange-paramedical-api.orange-paramedical.workers.dev/api
          VITE_API_BASE_URL: https://orange-paramedical-api.orange-paramedical.workers.dev/api

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Actions secret VITE_CLERK_PUBLISHABLE_KEY. Add the production Clerk pk_live_ publishable key."
            exit 1
          fi
          case "$VITE_CLERK_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo "::error::VITE_CLERK_PUBLISHABLE_KEY must be a production pk_live_ key."; exit 1;; esac
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Missing Actions secret CLERK_SECRET_KEY. Add the production Clerk secret key; it is deployed only to the API Worker."
            exit 1
          fi
          case "$CLERK_SECRET_KEY" in sk_live_*) ;; *) echo "::error::CLERK_SECRET_KEY must be a live Clerk secret key."; exit 1;; esac

      - name: Set Clerk secret on API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config worker/wrangler.jsonc

      - name: Deploy Clerk API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config worker/wrangler.jsonc

      - name: Deploy static website Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
