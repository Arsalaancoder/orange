name: Build and deploy Orange Paramedical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: /api
          VITE_API_BASE_URL: /api

      - name: Check Cloudflare deployment credentials
        id: check_cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token detected. Standalone worker deployment will execute."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets. Build and validation succeeded. Frontend and unified worker deployment is handled automatically by Cloudflare Workers Builds."
          fi
          if [ -n "$CLERK_SECRET_KEY" ]; then
            echo "has_clerk_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_clerk_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Clerk secret on API Worker
        if: steps.check_cf.outputs.has_token == 'true' && steps.check_cf.outputs.has_clerk_secret == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config worker/wrangler.jsonc

      - name: Deploy Clerk API Worker
        if: steps.check_cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config worker/wrangler.jsonc

      - name: Deploy static website Worker
        if: steps.check_cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
