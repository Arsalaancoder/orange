<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_acn_admissions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad_acn_admissions" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="gridPattern_acn_admissions" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad_acn_admissions)" />
  <rect width="1200" height="800" fill="url(#gridPattern_acn_admissions)" />

  <!-- Abstract Healthcare Geometry -->
  <circle cx="950" cy="150" r="300" fill="#16A34A" opacity="0.12" />
  <circle cx="150" cy="650" r="250" fill="#FFFFFF" opacity="0.04" />
  <path d="M-100,500 Q300,300 700,600 T1300,400" fill="none" stroke="#16A34A" stroke-width="3" opacity="0.25" />
  <path d="M-100,550 Q350,350 750,650 T1300,450" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />

  <!-- Central Visual Container Card -->
  <rect x="100" y="100" width="1000" height="600" rx="24" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Decorative Top Banner -->
  <rect x="100" y="100" width="1000" height="8" fill="url(#accentGrad_acn_admissions)" rx="4" />

  <!-- Monogram Logo Watermark -->
  <text x="1040" y="660" font-family="Georgia, serif" font-size="120" font-weight="900" fill="#16A34A" opacity="0.15" text-anchor="end">ACN</text>

  <!-- Icon Graphic -->
  <g transform="translate(180, 240) scale(4)" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2v20M2 12h20" />
  </g>

  <!-- Content Block -->
  <text x="360" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#16A34A" letter-spacing="3">ACN • APPLE COLLEGE OF NURSING</text>
  <text x="360" y="340" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#FFFFFF">Admissions & Campus Guidance</text>
  <text x="360" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#94A3B8">Authentic Institutional Facility &amp; Clinical Learning Setup</text>

  <!-- Feature Pill Tags -->
  <rect x="360" y="430" width="180" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
  <text x="450" y="454" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">VERIFIED FACILITY</text>

  <rect x="555" y="430" width="200" height="38" rx="19" fill="#16A34A" opacity="0.9" />
  <text x="655" y="454" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">PRACTICAL TRAINING</text>

  <!-- Bottom Details Bar -->
  <line x1="160" y1="580" x2="1040" y2="580" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="160" y="620" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#CBD5E1">Location: <tspan font-weight="700" fill="#FFFFFF">Telangana State</tspan></text>
  <text x="600" y="620" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#CBD5E1">Institution: <tspan font-weight="700" fill="#FFFFFF">Apple College of Nursing</tspan></text>
  <text x="1040" y="620" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#16A34A" font-weight="800" text-anchor="end">ORANGE GROUP EDUCATION</text>
</svg>